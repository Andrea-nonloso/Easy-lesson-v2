<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Easy Lesson: l'orario delle lezioni sempre in tasca, anche offline.">
  <meta name="theme-color" content="#16A34A" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1411" media="(prefers-color-scheme: dark)">

  <!-- Installabile come app su iPhone / iPad -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Easy Lesson">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Easy Lesson</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F4F7F4; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1411; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3d4a41; transition: opacity .35s ease;
    }
    @media (prefers-color-scheme: dark) { #splash { color: #c4d0c7; } }
    #splash img {
      width: 96px; height: 96px; border-radius: 28px;
      box-shadow: 0 12px 32px rgba(22, 163, 74, .35);
      animation: pop 1.4s ease-in-out infinite;
    }
    #splash span { font-size: 15px; letter-spacing: .02em; }
    @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    body.ready #splash { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Caricamento">
    <img src="icons/Icon-192.png" alt="">
    <span>Easy Lesson</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('ready');
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) s.remove();
      }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
