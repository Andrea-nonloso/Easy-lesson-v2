name: easy_lesson
description: Easy Lesson 2 - l'orario delle lezioni dell'IIS Rosselli, su telefono, tablet e web. Funziona anche offline.
publish_to: 'none'

version: 3.0.0+30

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  archive: '>=3.6.1 <5.0.0'
  file_picker: '>=8.1.2 <11.0.0'
  package_info_plus: '>=8.0.0 <11.0.0'
  # 2.4.0: QR, foto delle lezioni, Windows (notifiche e icona vicino all'orologio)
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  local_notifier: '>=0.1.6 <1.0.0'
  tray_manager: '>=0.2.3 <1.0.0'
  # 2.6.0: resoconto PDF, font ad alta leggibilità
  pdf: ^3.11.1
  google_fonts: '>=6.2.1 <8.0.0'
  # 2.7.0: cifratura dei backup online (AES-256-GCM, HKDF, SHA-256), anche sul web
  cryptography: ^2.7.0
  # 2.7.0: scanner dei QR nell'app (solo Android)
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#16A34A"
    theme_color: "#16A34A"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Hind
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: EasyIcons
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf

