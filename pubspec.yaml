name: easy_lesson
description: Easy Lesson 2 - l'orario delle lezioni dell'IIS Rosselli, su telefono, tablet e web. Funziona anche offline.
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  archive: '>=3.6.1 <5.0.0'
  file_picker: '>=8.1.2 <11.0.0'
  package_info_plus: '>=8.0.0 <11.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#16A34A"
    theme_color: "#16A34A"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Hind
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: EasyIcons
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
