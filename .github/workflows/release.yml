# Crea una release con Windows (installer + zip), Android (APK) e web (zip)
# quando si pubblica un tag, es.:  git tag v2.0.0 && git push origin v2.0.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Installa Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows
        shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk EasyLesson.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: EasyLesson.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: cd build/web && zip -r ../../EasyLesson-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: EasyLesson-Web.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Easy Lesson ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
