# Crea una release quando si pubblica un tag, es.:  git tag v2.0.1 && git push origin v2.0.1
# Contiene: installer + zip Windows, APK Android e zip web.
# Velocizzata (4/11/2026): cache di Gradle, Gradle senza daemon, Inno Setup solo se manca.
# (cache: true di flutter-action tiene gia' sia Flutter sia i pacchetti Dart.)
# La versione dell'app viene presa dal tag (v2.0.1 -> 2.0.1): le app installate la
# confrontano con l'ultima release per proporre l'aggiornamento.
#
# Firma Android stabile (necessaria perche' gli aggiornamenti si installino sopra):
# secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (vedi chiavi-android/LEGGIMI.txt).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Inno Setup: se c'e' gia' sulla macchina di GitHub non lo reinstalla.
      - name: Inno Setup (solo se manca)
        shell: pwsh
        run: |
          $ok = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                  "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if ($ok) { Write-Host "Inno Setup gia' presente: $($ok[0])" }
          else { choco install innosetup -y --no-progress }
      - name: Build Windows
        shell: pwsh
        run: ./build_windows.ps1 -Version ${{ steps.v.outputs.name }} -BuildNumber ${{ github.run_number }} -Tag ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle            # dipendenze di Gradle tenute tra un giro e l'altro (il guadagno piu' grosso)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Chiave di firma Android
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      - name: Avviso firma mancante
        if: env.KEYSTORE_B64 == ''
        run: |
          echo "::warning::APK firmato con chiave di debug, gli aggiornamenti non si installeranno sopra la versione precedente."
      - run: flutter pub get
      - name: Gradle piu' veloce in CI
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.daemon=false\norg.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.jvmargs=-Xmx4g\n' >> ~/.gradle/gradle.properties
      - run: flutter build apk --release --build-name=${{ steps.v.outputs.name }} --build-number=$((100 + ${{ github.run_number }})) --dart-define=EL_TAG=${{ github.ref_name }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk "Easy-Lesson-v${{ steps.v.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Easy-Lesson-v*.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define=EL_TAG=${{ github.ref_name }}
      - run: cd build/web && zip -r ../../Easy-Lesson-v${{ steps.v.outputs.name }}-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: Easy-Lesson-v*-Web.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"; fi
      - name: Dipendenze GTK e dpkg
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Impacchetta .deb
        run: |
          VERSION=${{ steps.v.outputs.name }}
          PKG=Easy-Lesson-v${VERSION}-Linux
          mkdir -p $PKG/DEBIAN $PKG/opt/easy-lesson $PKG/usr/share/applications
          cp -r build/linux/x64/release/bundle/* $PKG/opt/easy-lesson/
          printf 'Package: easy-lesson\nVersion: %s\nArchitecture: amd64\nMaintainer: Andrea\nDepends: libgtk-3-0\nDescription: Easy Lesson - orario di scuola e agenda\n' "$VERSION" > $PKG/DEBIAN/control
          printf '[Desktop Entry]\nName=Easy Lesson\nExec=/opt/easy-lesson/easy_lesson\nType=Application\nCategories=Utility;\nTerminal=false\n' > $PKG/usr/share/applications/easy-lesson.desktop
          dpkg-deb --root-owner-group --build $PKG "Easy-Lesson-v${VERSION}-Linux.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Easy-Lesson-v*-Linux.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android, web, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Easy Lesson ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: out/*
